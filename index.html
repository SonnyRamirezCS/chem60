<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chem 60 Exam 1 Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --bg:#F3F5F6;--surface:#FFFFFF;--ink:#15202B;--muted:#56626E;--line:#D5DBE0;--soft:#E9EEF1;
 --c1:#5B47C9;--c1s:#E7E2FB;--c2:#08806F;--c2s:#D6EFEA;--c3:#B0690E;--c3s:#F6E6CF;--onc:#FFFFFF;
 --ok:#17703D;--oks:#DFF2E6;--bad:#B03030;--bads:#F8E0E0;--warn:#8A5A00;--warns:#FBF0D6;--focus:#2D6BD6;
 --btn:#15202B;--btnInk:#FFFFFF;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#0F151B;--surface:#172029;--ink:#E6EBEF;--muted:#9AA7B2;--line:#2A3641;--soft:#1E2934;
 --c1:#A294F5;--c1s:#2A2550;--c2:#43C6B3;--c2s:#123A35;--c3:#EBA650;--c3s:#3D2A11;--onc:#0F151B;
 --ok:#5BD08E;--oks:#143222;--bad:#F07B7B;--bads:#3C1A1A;--warn:#F0C060;--warns:#3A2E10;--focus:#7BA7F5;
 --btn:#E6EBEF;--btnInk:#0F151B;color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0F151B;--surface:#172029;--ink:#E6EBEF;--muted:#9AA7B2;--line:#2A3641;--soft:#1E2934;
 --c1:#A294F5;--c1s:#2A2550;--c2:#43C6B3;--c2s:#123A35;--c3:#EBA650;--c3s:#3D2A11;--onc:#0F151B;
 --ok:#5BD08E;--oks:#143222;--bad:#F07B7B;--bads:#3C1A1A;--warn:#F0C060;--warns:#3A2E10;--focus:#7BA7F5;
 --btn:#E6EBEF;--btnInk:#0F151B;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
sup,sub{font-size:.72em;line-height:0}
.c1{--cc:var(--c1);--cs:var(--c1s)}.c2{--cc:var(--c2);--cs:var(--c2s)}.c3{--cc:var(--c3);--cs:var(--c3s)}

.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px;margin-bottom:20px}
.brand h1{margin:0;font-size:clamp(28px,6vw,40px);line-height:1;font-weight:800;letter-spacing:-.025em}
.brand p{margin:6px 0 0;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--soft);border-radius:999px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:999px;padding:8px 15px;font-weight:600;font-size:15px;color:var(--muted);white-space:nowrap}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
@media (max-width:560px){.tabs{width:100%}.tabs button{flex:1;padding:9px 4px;font-size:14px}}

.hero{display:grid;grid-template-columns:136px 1fr;column-gap:24px;row-gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:30px}
.donut{width:136px;height:136px;display:block;grid-row:1/span 2;align-self:center}
.donut .dn{font-size:23px;font-weight:800;fill:var(--ink)}.donut .dl{font-size:10px;fill:var(--muted)}
.sb.c1{fill:var(--c1s)}.sb.c2{fill:var(--c2s)}.sb.c3{fill:var(--c3s)}
.sf.c1{fill:var(--c1)}.sf.c2{fill:var(--c2)}.sf.c3{fill:var(--c3)}
.hero-h{align-self:end}
.hero .score{margin:0 0 6px;font-size:22px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin:0;padding:0;list-style:none;font-size:13.5px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;background:var(--cc)}
.hero .how{margin:6px 0 14px;color:var(--muted);font-size:15px;max-width:54ch}
.sync{margin:10px 0 0;font-size:13px;color:var(--muted)}
@media (max-width:520px){.hero{grid-template-columns:92px 1fr;column-gap:14px;row-gap:12px;padding:16px}.donut{width:92px;height:92px;grid-row:auto}.hero-h{align-self:center}.hero .score{font-size:18px}.hero-t{grid-column:1/-1}.hero .how{margin-top:0;font-size:14.5px}.hero .btn{width:100%}}

.chap{margin:0 0 30px}
.chap h2{margin:0;font-size:19px;font-weight:700;display:flex;align-items:baseline;gap:10px;letter-spacing:-.01em}
.chap h2 .cn{color:var(--cc);font-weight:800}
.chap .meta{margin:2px 0 12px;color:var(--muted);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
@media (max-width:420px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}}
.tile{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;text-align:left;min-height:124px;padding:8px 9px 10px;border:1.5px solid var(--cc);border-radius:8px;background:var(--surface)}
.tile .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--p) * 100%);background:var(--cs);z-index:-1;transition:height .35s ease}
.tile .no{font-size:12px;font-weight:600;color:var(--muted);line-height:1.2}
.tile .sy{font-size:31px;font-weight:800;line-height:1;letter-spacing:-.03em;color:var(--cc);margin:8px 0 6px}
.tile .nm{font-size:12.5px;font-weight:500;line-height:1.25;overflow-wrap:anywhere}
.tile .pips{position:absolute;top:10px;right:8px;display:flex;gap:3px}
.tile .pips i{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--cc)}
.tile .pips i.on{background:var(--cc)}
.tile.done{background:var(--cc);color:var(--onc)}
.tile.done .sy,.tile.done .no{color:var(--onc)}
.tile.done .pips i{border-color:var(--onc);background:var(--onc)}
.tile.off{opacity:.45;border-style:dashed}
.tile:hover:not(.done){background:color-mix(in srgb,var(--cs) 35%,var(--surface))}
@media (max-width:420px){.tile{min-height:112px;padding:7px 7px 9px}.tile .sy{font-size:27px}.tile .nm{font-size:12px}}

.settings{margin-top:10px;border-top:1px solid var(--line);padding-top:14px}
.settings summary{cursor:pointer;font-weight:700;font-size:16px;padding:4px 0;width:max-content}
.set-body{display:grid;gap:14px;margin-top:12px;max-width:640px}
.sw{display:flex;gap:12px;align-items:flex-start}
.sw input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--c2);flex:none}
.set-body small{color:var(--muted);font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

.btn{border:0;border-radius:10px;padding:12px 20px;min-height:48px;font-weight:700;font-size:16px;line-height:1.2}
.btn.primary{background:var(--btn);color:var(--btnInk)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:8px 14px;font-size:15px}
.btn.danger{border-color:var(--bad);color:var(--bad)}

/* practice */
.pwrap{max-width:720px;margin:0 auto;padding:12px 16px 0}
.pbar{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.back{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px 7px 11px;font-weight:600;font-size:14px}
.ptitle{font-weight:700;font-size:17px;line-height:1.25}
.ptitle .sec{color:var(--cc);margin-right:7px;font-weight:800}
.meter{display:flex;align-items:center;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.meter .segs{display:flex;gap:4px}
.meter .segs i{width:36px;height:9px;border-radius:5px;background:var(--soft);border:1px solid var(--line)}
.meter .segs i.on{background:var(--cc);border-color:var(--cc)}
.meter .mt{font-size:14px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.prompt{font-size:17px}
.prompt p{margin:0 0 10px}
.prompt p:last-child{margin-bottom:0}
blockquote{margin:10px 0 4px;padding:10px 14px;border-left:4px solid var(--cc);background:var(--soft);border-radius:0 8px 8px 0;font-size:17px}
.big-num{font-size:24px;font-weight:600;overflow-x:auto;white-space:nowrap;padding:2px 0;letter-spacing:.005em}
.big-num.sm{font-size:21px;display:inline-block;vertical-align:middle;padding:0}
.hint{font-size:14px;color:var(--muted)}
html.nosf .sfh{display:none}
table.mini{border-collapse:collapse;margin:8px 0 2px;font-size:15px}
table.mini th,table.mini td{text-align:left;padding:5px 14px 5px 0;border-bottom:1px solid var(--line)}
table.mini th{font-weight:600;color:var(--muted);font-size:13.5px}
.visual{margin:14px 0 2px;overflow-x:auto}
svg.ruler{width:100%;max-width:520px;height:auto;display:block}
.rb{fill:var(--c3s);stroke:var(--c3);stroke-width:1}
.rt{stroke:var(--ink);stroke-width:1}.rt.rm{stroke-width:1.7}
.rn{fill:var(--ink);font-size:12px;font-weight:700;font-family:inherit}
.obj{fill:var(--c1);opacity:.88}
.guide{stroke:var(--c1);stroke-width:1.3;stroke-dasharray:3 2}
.choices{display:grid;gap:8px;margin-top:16px}
.choice{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;padding:11px 14px;text-align:left;font-size:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.choice .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);transition:border-width .12s}
.choice[aria-checked="true"]{border-color:var(--ink)}
.choice[aria-checked="true"] .dot{border:6px solid var(--ink)}
.choice.right{border-color:var(--ok);background:var(--oks)}
.choice.right .dot{border:6px solid var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bads)}
.choice.wrong .dot{border:6px solid var(--bad)}
.numwrap{margin-top:16px}
.numrow{display:flex;align-items:center;gap:10px}
.numrow input{flex:1;min-width:0;font-family:inherit;font-size:21px;font-weight:600;padding:11px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.numrow input:focus{border-color:var(--focus);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.numrow input:disabled{opacity:.75}
.unit{font-weight:600;font-size:17px;color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{border:1px solid var(--line);background:var(--soft);border-radius:8px;min-height:42px;min-width:58px;padding:6px 12px;font-weight:700;font-size:16px}
.preview{margin-top:8px;font-size:15px;color:var(--muted);min-height:1.4em}
.fb{margin-top:12px;border-radius:12px;padding:12px 15px;font-size:15.5px;border:1px solid transparent}
.fb.ok{background:var(--oks);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bads);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.fb.bad b{color:var(--bad)}
.fb.warn,.fb.info{background:var(--warns);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.fb.warn b,.fb.info b{color:var(--warn)}
.exp{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:14px;padding:16px 18px}
.exp h3{margin:0 0 10px;font-size:16px}
.exp ol{margin:0;padding-left:22px}
.exp li{margin:0 0 10px;padding-left:2px}
.exp .final{margin:4px 0 0;padding-top:10px;border-top:1px solid var(--line);font-weight:700}
.math{overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:8px 0 6px;margin-top:2px}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.93em;line-height:1.3}
.frac>span{padding:0 4px}
.frac .fnum{border-bottom:1.5px solid currentColor}
.pw{white-space:nowrap}
.cx{text-decoration:line-through;text-decoration-color:var(--bad);text-decoration-thickness:1.6px;color:var(--muted)}
.sg{color:var(--c2);font-weight:800}.ns{color:var(--muted);opacity:.65}
.actions{position:sticky;bottom:0;z-index:5;display:flex;gap:10px;justify-content:flex-end;margin-top:14px;padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.actions .btn.primary{min-width:170px}
@media (max-width:560px){.actions .btn{flex:1}.actions .btn.primary{min-width:0}}
.stats{font-size:13.5px;color:var(--muted);margin:14px 0 0}

/* knowledge check */
.kc-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;max-width:680px}
.kc-card h2{margin:0 0 6px;font-size:22px}
.kc-card p{margin:0 0 14px;color:var(--muted)}
.kc-opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 18px}
.hist{margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line);list-style:none;display:grid;gap:6px;font-size:14.5px}
.hist li{display:flex;justify-content:space-between;gap:10px}
.kchead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
.kchead .qn{font-weight:700}
.kchead .tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.kbar{height:6px;background:var(--soft);border-radius:3px;margin:0 0 14px;overflow:hidden}
.kbar i{display:block;height:100%;background:var(--ink);border-radius:3px}
.result{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:0 0 8px}
.result .big{font-size:52px;font-weight:800;letter-spacing:-.03em;line-height:1}
.missed{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.missed button{border:1.5px solid var(--cc);background:var(--cs);border-radius:8px;padding:8px 12px;font-size:14.5px;font-weight:600;text-align:left}
.missed button b{color:var(--cc);margin-right:6px}
.rev{border-top:1px solid var(--line)}
.rev summary{cursor:pointer;padding:12px 0;display:flex;gap:10px;align-items:center;font-weight:600}
.rev summary::-webkit-details-marker{display:none}
.mk{flex:none;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.mk.y{background:var(--oks);color:var(--ok)}.mk.n{background:var(--bads);color:var(--bad)}
.rv{padding:0 0 16px}
.rv p{margin:8px 0}

/* sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel h2{margin:0 0 4px;font-size:19px}
.panel .sub{margin:0 0 14px;color:var(--muted);font-size:14.5px}
.panel h3{margin:18px 0 8px;font-size:15px}
.fl{padding:9px 0;border-bottom:1px solid var(--line);font-size:17px;overflow-x:auto;white-space:nowrap}
.fl:last-child{border-bottom:0}
.fl small{display:block;white-space:normal;color:var(--muted);font-size:13.5px}
.eqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:15px}
.eqs span{padding:4px 0;border-bottom:1px dashed var(--line)}
.eqs em{font-style:normal;color:var(--muted);font-size:12.5px;margin-left:4px}
.plist{margin:0;padding-left:20px}.plist li{margin:0 0 6px}
table.pfx{border-collapse:collapse;width:100%;font-size:15px}
table.pfx td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line)}
table.pfx td:first-child{font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

/* ===== v2: answer boxes ===== */
.numrow{flex-wrap:wrap;row-gap:8px}
.nf{display:inline-flex;align-items:stretch;min-width:0;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);overflow:hidden}
.nf:focus-within{border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
.nf .pm{flex:none;border:0;border-right:1px solid var(--line);background:var(--soft);width:40px;font-size:18px;font-weight:700;color:var(--muted)}
.nf input.nin{border:0;outline:none;background:transparent;color:var(--ink);font-family:inherit;font-size:20px;font-weight:600;padding:10px 12px;width:150px;min-width:0}
.nf input.nin:disabled{opacity:.8}
.numrow>.nf:first-child{flex:0 1 auto}
.nf input.exp{width:70px;font-size:17px;padding:7px 8px}
.nf input.sm{width:64px;font-size:18px;text-align:center}
.x10{font-size:20px;font-weight:600;white-space:nowrap}
.expbox{display:inline-block;vertical-align:top;position:relative;top:-14px;line-height:1;font-size:1em}
.expbox .nf .pm{width:32px;font-size:16px}
.sci .unit,.numrow .unit{margin-left:2px}
.sfrow{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15.5px;font-weight:600;color:var(--muted)}
.linkbtn{border:0;background:none;padding:8px 0 0;color:var(--focus);font-weight:600;font-size:14.5px;text-decoration:underline;text-underline-offset:3px}
.checks .box{flex:none;width:20px;height:20px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center}
.checks .choice[aria-checked="true"] .box{background:var(--ink);border-color:var(--ink)}
.checks .choice[aria-checked="true"] .box::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.checks .choice.right .box{background:var(--ok);border-color:var(--ok)}
.checks .choice.wrong .box{background:var(--bad);border-color:var(--bad)}
.choice.missed{border-color:var(--ok);border-style:dashed}
.choice .tag{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--ok)}
@media (max-width:420px){.nf input.nin{width:120px;font-size:19px}.nf input.exp{width:58px}}

/* ===== v2: home ===== */
.banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--warns);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 14px;margin:0 0 16px}
.hero-btns{display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:520px){.hero-btns .btn{flex:1 1 100%}}

/* ===== v2: practice exam ===== */
.ebar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.ebar-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.etime{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;min-width:62px}
.etime.low{color:var(--bad)}
.eprog{color:var(--muted);font-size:14px;margin-right:auto}
.enav{max-width:780px;margin:0 auto;padding:4px 16px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.enav button{min-height:40px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;font-weight:700;font-size:15px;position:relative}
.enav button.a{background:var(--soft);border-color:var(--ink)}
.enav button.f::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.ewrap{max-width:780px;margin:0 auto;padding:16px 16px 40px}
.eintro h2{margin:6px 0 6px;font-size:22px}
.eintro p{margin:0 0 8px;color:var(--muted);font-size:15px}
.eq{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:16px 0;scroll-margin-top:calc(env(safe-area-inset-top,0px) + 76px);overflow:hidden}

<body>
<div id="app"></div>
<script>
"use strict";
/* ================= helpers ================= */
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const rndf=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pl=(n,w)=>n+' '+w+(n===1?'':'s');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ================= numbers ================= */
function expOf(x){return parseInt(Number(x).toExponential().split('e')[1],10);}
function clean(x){return Number(Number(x).toPrecision(12));}
function roundSF(x,n){if(x===0)return 0;return Number(clean(x).toPrecision(n));}
function roundDP(x,dp){const k=Math.pow(10,dp);const y=clean(x*k);return (Math.sign(y)*Math.round(Math.abs(y)))/k||0;}
function fmtSF(x,n){
  if(x===0)return n>1?'0.'+'0'.repeat(n-1):'0';
  const r=roundSF(x,n),e=expOf(r);
  if(e>=6||e<=-5||e>=n){const p=r.toExponential(n-1).split('e');return p[0]+'×10^'+parseInt(p[1],10);}
  const d=n-1-e;let s=r.toFixed(d);if(d===0&&/0$/.test(s))s+='.';return s;
}
function fmtDP(x,dp){return roundDP(x,dp).toFixed(Math.max(0,dp));}
function rawStr(x){
  if(x===0)return '0';
  const r=Number(x.toPrecision(7));const e=expOf(r);
  if(e>=7||e<=-5){const p=r.toExponential(6).split('e');return p[0].replace(/\.?0+$/,'')+'×10^'+parseInt(p[1],10);}
  return String(r);
}
function group(s){const m=String(s).match(/^(-?)(\d+)(.*)$/);if(!m||m[2].length<5)return String(s);return m[1]+m[2].replace(/\B(?=(\d{3})+(?!\d))/g,',')+m[3];}
/* number string -> html (handles ×10^n and minus signs) */
function nH(s){
  s=String(s);const m=s.match(/^(.*?)×10\^(-?\d+)$/);let out;
  if(m)out=group(m[1])+'&thinsp;×&thinsp;10<sup>'+m[2].replace('-','−')+'</sup>';else out=group(s);
  return out.replace(/^-/,'−');
}
const pow10H=e=>'10<sup>'+(e<0?'−'+(-e):e)+'</sup>';
function uH(u){return String(u||'').replace(/²/g,'<sup>2</sup>').replace(/³/g,'<sup>3</sup>');}
const frac=(t,b)=>`<span class="frac"><span class="fnum">${t}</span><span class="fden">${b}</span></span>`;
const cx=u=>`<span class="cx">${uH(u)}</span>`;
function genSF(n,e){
  const d=[rnd(1,9)];for(let i=1;i<n;i++)d.push(rnd(0,9));if(n>1)d[n-1]=rnd(1,9);
  const v=clean(parseInt(d.join(''),10)*Math.pow(10,e-n+1));
  return {v,n,s:fmtSF(v,n)};
}
function measured(x,n){const v=roundSF(x,n);return {v,n,s:fmtSF(v,n)};}
function massVal(x){return measured(x,Math.abs(x)>=999.5?4:3);}
function toStd(digs,e){
  const n=digs.length;
  if(e>=0){if(e>=n-1)return digs+'0'.repeat(e-n+1);return digs.slice(0,e+1)+'.'+digs.slice(e+1);}
  return '0.'+'0'.repeat(-e-1)+digs;
}

/* ================= parsing + checking ================= */
const SUP={'⁰':'0','¹':'1','²':'2','³':'3','⁴':'4','⁵':'5','⁶':'6','⁷':'7','⁸':'8','⁹':'9','⁻':'-','⁺':'+'};
function countSF(s){
  s=String(s).replace(/^[+-]/,'');
  if(s.includes('.')){const t=s.replace('.','').replace(/^0+/,'');if(t==='')return {min:1,max:1};return {min:t.length,max:t.length};}
  const t=s.replace(/^0+/,'');if(t==='')return {min:1,max:1};
  const tr=t.match(/0*$/)[0].length;return {min:Math.max(1,t.length-tr),max:t.length};
}
function parseNum(raw){
  if(raw==null)return null;
  let s=String(raw).trim().replace(/[\s,]/g,'').replace(/[−–—]/g,'-').replace(/[×xX*·•]/g,'x').replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺]/g,c=>SUP[c]);
  if(!s)return null;
  const m=s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:x10\^?\(?([+-]?\d+)\)?|[eE]([+-]?\d+))?$/);
  if(!m)return null;
  const coef=m[1];const es=m[2]!==undefined?m[2]:m[3];const hasExp=es!==undefined;const exp=hasExp?parseInt(es,10):0;
  const c=parseFloat(coef);const value=clean(c*Math.pow(10,exp));
  const body=coef.replace(/^[+-]/,'');const dp=body.includes('.')?body.split('.')[1].length:0;
  return {coef,c,exp,hasExp,value,sf:countSF(coef),dp};
}
/* answer spec for numeric questions */
function sciStr(x,n){const p=roundSF(x,n).toExponential(n-1).split('e');return p[0]+'×10^'+parseInt(p[1],10);}
/* answer spec for numeric questions. fields: one | sci (two boxes) | sciSF (three boxes) | std (plain number only) */
function numAns(exact,o){
  o=o||{};
  const a={kind:'num',exact,tol:o.tol==null?1:o.tol,units:o.units||'',sfMode:o.sfMode||'strict',fields:o.fields||'one'};
  if(o.sf!=null){a.R=roundSF(exact,o.sf);a.u=a.R===0?Math.pow(10,-o.sf):Math.pow(10,expOf(a.R)-o.sf+1);a.N=o.sf;}
  else{a.R=roundDP(exact,o.dp);a.u=Math.pow(10,-o.dp);a.N=a.R===0?null:expOf(a.R)+1+o.dp;}
  a.display=(a.fields==='sci'||a.fields==='sciSF')?sciStr(a.R,a.N):(o.sf!=null?fmtSF(exact,o.sf):fmtDP(exact,o.dp));
  if(o.alts)a.alts=o.alts.map(x=>({v:clean(x[0]),msg:x[1],abs:x[2]}));
  return a;
}
/* exact-value answers (scientific notation practice): sfRange = allowed sig fig counts */
function exactAns(value,display,fields,sfRange){return {kind:'num',mode:'exact',exact:value,R:value,display,fields,sfMode:'always',sfRange,units:''};}
function sfFits(r,a){if(a.sfRange)return r.min<=a.sfRange.max&&r.max>=a.sfRange.min;return r.min<=a.N&&a.N<=r.max;}
function wantSF(a,strict){return !!(a.N||a.sfRange)&&(a.sfMode==='always'||a.sfMode==='note'||(a.sfMode==='strict'&&strict));}
const fixMinus=s=>String(s==null?'':s).trim().replace(/[−–—]/g,'-');
/* resp: mc -> index, multi -> array of indices, everything else -> array of box strings */
function checkAnswer(q,resp,strict){
  const a=q.ans;
  if(a.kind==='mc'){if(resp==null||resp<0)return {invalid:true,msg:'Pick an answer first.'};const ok=resp===a.correct;return {ok,score:ok?1:0};}
  if(a.kind==='multi'){
    const sel=Array.isArray(resp)?resp:[];if(!sel.length)return {invalid:true,msg:'Select at least one answer.'};
    const C=new Set(a.correct);let right=0,wrong=0;sel.forEach(i=>{if(C.has(i))right++;else wrong++;});
    const ok=right===C.size&&wrong===0;
    let msg='';if(!ok)msg=right===C.size?'You got all the right ones, plus at least one that does not apply.':(wrong===0?'Everything you picked applies, but something is missing.':'');
    return {ok,score:Math.max(0,(right-wrong)/C.size),msg};
  }
  const r=Array.isArray(resp)?resp:[resp];
  const c0=fixMinus(r[0]),c1=fixMinus(r[1]),c2=fixMinus(r[2]);
  if(a.kind==='int'){if(!/^\d+$/.test(c0))return {invalid:true,msg:'Enter a whole number.'};const ok=parseInt(c0,10)===a.value;return {ok,score:ok?1:0};}
  if(a.kind==='reading'){
    const p=parseNum(c0);if(!p)return {invalid:true,msg:'Type the reading as a number, like 3.4.'};
    if(p.hasExp)return {invalid:true,msg:'Write the reading as a plain number, without ×10.'};
    if(Math.abs(p.value-a.x)>a.allow)return {ok:false,score:0,msg:'That does not match where the end of the bar lines up. Check which two marks it sits between.'};
    if(p.dp!==a.dp)return {ok:false,score:0,msg:p.dp<a.dp?'Add one estimated digit past the smallest marking.':'Too many digits. You can only estimate one digit past the smallest marking.'};
    return {ok:true,score:1};
  }
  const f=a.fields||'one',sci=f==='sci'||f==='sciSF';
  if(!c0)return {invalid:true,msg:sci?'Type the number part in the first box.':'Type your answer in the box.'};
  if(sci&&!c1)return {invalid:true,msg:'Fill in the power of ten in the second box.'};
  if(c1&&!/^[+-]?\d+$/.test(c1))return {invalid:true,msg:'The power of ten has to be a whole number, like 5 or -3.'};
  if(f==='sciSF'&&!/^\d+$/.test(c2))return {invalid:true,msg:'Fill in the number of significant figures in the last box.'};
  const p=parseNum((sci||c1)?c0+'×10^'+c1:c0);
  if(!p)return {invalid:true,msg:sci?'The first box should be just a number, like 4.52.':'Enter a number like 4.52. Tap “× 10ⁿ” if you want to add a power of ten.'};
  const allow=a.mode==='exact'?Math.abs(a.exact)*1e-9+1e-15:(0.5+a.tol)*a.u*(1+1e-9)+1e-15;
  const diff=Math.abs(p.value-a.exact);
  let res=null;
  if(diff>allow){
    let msg='';
    const alt=(a.alts||[]).find(al=>isFinite(al.v)&&al.v!==0&&Math.abs(p.value-al.v)<=(al.abs!=null?Math.max(al.abs,allow):Math.max(Math.abs(al.v)*0.006,allow)));
    if(alt)msg=alt.msg;
    else if(a.exact!==0&&Math.abs(p.value+a.exact)<=allow)msg='Check the sign of your answer.';
    else if(a.exact!==0&&p.value!==0){
      const lr=Math.log10(Math.abs(p.value/a.exact)),k=Math.round(lr);
      if(k!==0&&Math.abs(lr-k)<0.01)msg='The digits look right but the power of ten is off. Check the decimal point or the exponent.';
      else if(diff/Math.abs(a.exact)<0.03)msg='Close. Check your rounding, and avoid rounding in the middle of a calculation.';
    }
    res={ok:false,msg};
  }else if(sci&&(Math.abs(parseFloat(c0))<1||Math.abs(parseFloat(c0))>=10)){
    res={ok:false,msg:'Right value, but the first box should be a number from 1 up to (not including) 10.'};
  }else if(f==='std'&&p.hasExp){
    res={ok:false,msg:'Right value, but write it as a regular decimal number without ×10.'};
  }else if(wantSF(a,strict)&&!sfFits(p.sf,a)){
    if(a.sfMode==='note')res={ok:true,note:'Tip: report it as '+nH(a.display)+(a.units?' '+uH(a.units):'')+' to match the decimal places you started with.'};
    else res={ok:false,msg:a.mode==='exact'?'Right value, but keep every significant figure from the original number.':'Right value, but check your significant figures.'};
  }else if(f==='sciSF'&&parseInt(c2,10)!==a.N){
    res={ok:false,msg:'Your number is right, but the sig fig count in the last box is off.'};
  }else res={ok:true};
  // partial credit (practice exam): score each box separately for multi-box answers
  if(sci){
    const e=expOf(a.R),cx=a.exact/Math.pow(10,e);const p0=parseNum(c0);
    const coefOK=!!p0&&!p0.hasExp&&Math.abs(p0.value-cx)<=(a.mode==='exact'?Math.abs(cx)*1e-9+1e-15:allow/Math.pow(10,e))&&(!wantSF(a,strict)||sfFits(p0.sf,a));
    const parts=[coefOK,parseInt(c1,10)===e];if(f==='sciSF')parts.push(parseInt(c2,10)===a.N);
    res.score=parts.filter(Boolean).length/parts.length;
    if(res.ok&&res.score<1)res.score=1;
  }else res.score=res.ok?1:0;
  return res;
}
/* explains the student's specific mistake, shown above the worked solution */
function whyWrong(q,resp,res){
  if(q.type==='mc'){
    if(resp==null||resp<0)return 'You left this one blank.';
    const d=q.defs&&q.defs[resp];
    return `You picked <b>${q.choices[resp]}</b>. `+(d?d:`The correct answer is <b>${q.choices[q.ans.correct]}</b>.`);
  }
  if(q.type==='multi'){
    const sel=Array.isArray(resp)?resp:[];if(!sel.length)return 'You left this one blank.';
    const C=new Set(q.ans.correct);const out=[];
    sel.filter(i=>!C.has(i)).forEach(i=>out.push(`<b>${q.choices[i]}</b> does not apply. ${q.no&&q.no[i]?q.no[i]:''}`));
    [...C].filter(i=>!sel.includes(i)).forEach(i=>out.push(`You missed <b>${q.choices[i]}</b>. ${q.yes&&q.yes[i]?q.yes[i]:''}`));
    return out.join('<br>');
  }
  const r=Array.isArray(resp)?resp:[resp];

const EQ=[
 ['in','cm','2.54',true],['km','mi','0.6214',false],['m','in','39.37',false],['m','yd','1.097',false],['ft','cm','30.48',true],
 ['kg','lb','2.205',false],['lb','g','453.59',false],['oz','g','28.35',false],['L','qt','1.057',false],['gal','L','3.785',false],
 ['acre','ft²','43560',true],['hr','min','60',true],['min','s','60',true],['day','hr','24',true],
 ['km','m','1000',true],['m','cm','100',true],['cm','mm','10',true],['ft','in','12',true],
 ['L','mL','1000',true],['kg','g','1000',true],['g','mg','1000',true],['mL','cm³','1',true],['L','cm³','1000',true],
 ['cal','J','4.184',true],['Cal','cal','1000',true],['kJ','J','1000',true],['kcal','cal','1000',true]

function lookup(a,b){
  for(const r of EQ){
    const sf=r[3]?Infinity:countSF(r[2]).min;
    if(r[0]===a&&r[1]===b)return {f:parseFloat(r[2]),top:r[2],bot:'1',exact:r[3],sf,q:r[2]};
    if(r[0]===b&&r[1]===a)return {f:1/parseFloat(r[2]),top:'1',bot:r[2],exact:r[3],sf,q:r[2]};
  }
  throw new Error('no factor '+a+' to '+b);
}
const supP=p=>p===2?'²':p===3?'³':'';
function convCalc(given,steps,fromU,toU){
  let exact=given.v;const lims=[];let usedExact=false;const facs=[];const powNotes=[];
  steps.forEach((st,i)=>{
    const L=lookup(st.a,st.b);exact*=Math.pow(L.f,st.p);
    if(L.exact)usedExact=true;else lims.push(L);
    const last=i===steps.length-1;
    let h=frac(`${nH(group(L.top))} ${last?uH(st.b):cx(st.b)}`,`${nH(group(L.bot))} ${cx(st.a)}`);
    if(st.p>1){
      h=`<span class="pw">(${h})<sup>${st.p}</sup></span>`;
      const tn=Math.pow(parseFloat(L.top),st.p),bn=Math.pow(parseFloat(L.bot),st.p);
      powNotes.push(`Raise the whole factor to the ${st.p===2?'2nd':'3rd'} power, number and unit: (${frac(nH(group(L.top))+' '+uH(st.b),nH(group(L.bot))+' '+uH(st.a))})<sup>${st.p}</sup> = ${frac(nH(rawStr(tn))+' '+uH(st.b+supP(st.p)),nH(rawStr(bn))+' '+uH(st.a+supP(st.p)))}`);
    }
    facs.push(h);
  });
  exact=clean(exact);
  const N=Math.min(given.n,...lims.map(L=>L.sf));
  const map=[fromU,...steps.map(s=>s.b+supP(s.p))].map(uH).join(' → ');
  let sfLine=`${nH(given.s)} has ${pl(given.n,'sig fig')}`;
  lims.forEach(L=>{sfLine+=`, ${L.q} has ${L.sf}`;});
  sfLine+='.';
  if(usedExact)sfLine+=' Exact numbers (like 1000, 60, 12, 4.184 and 2.54) never limit sig figs.';
  sfLine+=` Round to ${N}.`;
  const explain=[`Solution map: ${map}`,...powNotes,`<div class="math">${nH(given.s)} ${cx(fromU)} × ${facs.join(' × ')} = ${nH(rawStr(exact))} ${uH(toU)}</div>`,sfLine];
  const alts=[{v:clean(given.v*given.v/exact),msg:'It looks like a conversion factor is upside down. Put the unit you are converting from on the bottom so it cancels.'}];
  if(steps.some(s=>s.p>1)){let np=given.v;steps.forEach(s=>{np*=lookup(s.a,s.b).f;});alts.push({v:clean(np),msg:'Remember to square or cube the number in the conversion factor, not just the unit.'});}
  const ans=numAns(exact,{sf:N,tol:1,units:toU});ans.alts=alts;
  explain.unshift(`Given: ${nH(given.s)} ${uH(fromU)}. Find: ${uH(toU)}.`);
  return {exact,N,explain,ans};
}

function buildCustom(n,ids){

const sync={ref:null,writing:false,dirty:false,timer:null,on:false,wait:2000};

function saveLocal(){store.set(KEY,JSON.stringify(S));}
function save(){S.updatedAt=Date.now();saveLocal();queueRemote();}
function queueRemote(){if(!sync.ref)return;sync.dirty=true;clearTimeout(sync.timer);sync.timer=setTimeout(flush,1200);}
async function flush(){
  if(!sync.ref||sync.writing||!sync.dirty)return;
  if(navigator.onLine===false){setSync();return;}
  sync.writing=true;sync.dirty=false;
  try{await sync.ref.set(JSON.parse(JSON.stringify(S)));sync.on=true;sync.wait=2000;setSync();}
  catch(e){const c=e&&e.code;if(c==='unavailable'||c==='resource_exhausted'){sync.dirty=true;sync.wait=Math.min(sync.wait*2,60000);setTimeout(flush,sync.wait);}else{sync.ref=null;sync.on=false;}setSync();}
  finally{sync.writing=false;}
}
function syncText(){
  if(navigator.onLine===false)return 'You are offline. Everything still works, and progress is saved on this device.';
  return sync.on?'Progress syncs across your devices.':'Progress is saved in this browser.';
}
function setSync(){const el=document.getElementById('sync');if(el)el.textContent=syncText();}
function adopt(r){S=r;saveLocal();applyTheme();if(V.view==='home'||V.view==='sheet'||(V.view==='exam'&&V.exam.phase==='setup'))render();}
async function pull(){
  if(!sync.ref)return;
  try{const snap=await sync.ref.get();
    if(snap.exists){const r=norm(JSON.parse(JSON.stringify(snap.data())));if(r.updatedAt>S.updatedAt)adopt(r);else if(S.updatedAt>r.updatedAt)queueRemote();}
    else if(S.updatedAt>0)queueRemote();
  }catch(e){}
}
async function initSync(){
  if(!window.claude||typeof window.claude.use!=='function')return;
  try{
    const both=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!both[0]||!both[1])return;const uid=await both[1].id();if(!uid)return;
    sync.ref=both[0].doc('data/users/'+uid+'/progress');sync.on=true;
    await pull();setSync();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull();});
  }catch(e){sync.ref=null;sync.on=false;}
}
window.addEventListener('online',()=>{setSync();if(sync.ref){pull();if(sync.dirty)flush();}});

function applyTheme(){

/* ---------- small helpers ---------- */
const active=()=>TOPICS.filter(t=>S.set.opt||!t.opt);
const GOAL=()=>S.set.goal,STREAK=()=>S.set.streak;
function pipsHTML(s){let h='';for(let i=0;i<GOAL();i++)h+=`<i class="${s.m||i<s.p?'on':''}"></i>`;return h;}
/* ALEKS-style: each first-try correct answer fills a step; a streak masters early; a miss knocks you back a step and resets the streak */
function gain(s){s.s++;if(!s.m){s.p=Math.min(GOAL(),s.p+1);if(s.p>=GOAL()||(STREAK()&&s.s>=STREAK())){s.m=true;s.p=GOAL();return true;}}return false;}
function knock(s){s.s=0;if(!s.m)s.p=Math.max(0,s.p-1);}
function nextSection(fromId){
  const list=active();const i=list.findIndex(t=>t.id===fromId);
  for(let k=1;k<=list.length;k++){const t=list[(i+k)%list.length];if(!S.t[t.id].m)return t;}
  return null;
}
function ruleText(){const g=GOAL(),st=STREAK();return `Each right answer on the first try fills one of ${g} steps. ${st?`Get ${st} in a row and you master the section early. `:''}A miss knocks you back a step and resets your streak.`;}
const nextTopic=()=>active().find(t=>!S.t[t.id].m);
const topic=id=>TOPICS.find(t=>t.id===id);
const isMix=id=>String(id).startsWith('mix-');
const mixCh=id=>id==='mix-all'?0:+String(id).slice(4);
const mixName=id=>id==='mix-all'?'Mixed practice: all chapters':`Mixed practice: chapter ${mixCh(id)}`;
function navOrder(){const out=[];[1,2,3].forEach(c=>{out.push('mix-'+c);TOPICS.filter(t=>t.ch===c).forEach(t=>out.push(t.id));});return out;}
function navLabel(id){if(isMix(id))return mixName(id);const t=topic(id);return t.sec+' '+t.name;}
function topicSelect(cur){
  let h=`<select id="tsel" aria-label="Jump to a topic or chapter"><option value="mix-all"${cur==='mix-all'?' selected':''}>Mixed practice: all chapters</option>`;
  [1,2,3].forEach(c=>{h+=`<optgroup label="Chapter ${c}: ${CH[c]}"><option value="mix-${c}"${cur==='mix-'+c?' selected':''}>Mixed: all of chapter ${c}</option>`;
    TOPICS.filter(t=>t.ch===c).forEach(t=>{const s=S.t[t.id];h+=`<option value="${t.id}"${cur===t.id?' selected':''}>${t.sec} ${esc(t.name)}${s.m?' ✓':''}${t.opt?' (optional)':''}</option>`;});h+='</optgroup>';});
  return h+'</select>';
}
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function sector(cx,cy,r0,r1,a0,a1){
  const Q=(r,a)=>[(cx+r*Math.sin(a)).toFixed(3),(cy-r*Math.cos(a)).toFixed(3)];
  const lg=(a1-a0)>Math.PI?1:0;const p0=Q(r1,a0),p1=Q(r1,a1),p2=Q(r0,a1),p3=Q(r0,a0);
  return `M${p0[0]} ${p0[1]}A${r1} ${r1} 0 ${lg} 1 ${p1[0]} ${p1[1]}L${p2[0]} ${p2[1]}A${r0} ${r0} 0 ${lg} 0 ${p3[0]} ${p3[1]}Z`;
}
function donut(){
  const act=active(),tot=act.length,gap=0.05;let a=0,paths='';
  [1,2,3].forEach(ch=>{
    const ts=act.filter(t=>t.ch===ch);if(!ts.length)return;
    const span=ts.length/tot*2*Math.PI,a0=a+gap/2,a1=a+span-gap/2,f=ts.filter(t=>S.t[t.id].m).length/ts.length;
    paths+=`<path class="sb c${ch}" d="${sector(60,60,36,58,a0,a1)}"/>`;
    if(f>0)paths+=`<path class="sf c${ch}" d="${sector(60,60,36,58,a0,a0+(a1-a0)*f)}"/>`;a+=span;
  });
  const m=act.filter(t=>S.t[t.id].m).length;
  return `<svg class="donut" viewBox="0 0 120 120" role="img" aria-label="${m} of ${tot} topics mastered">${paths}<text x="60" y="61" text-anchor="middle" class="dn">${Math.round(m/tot*100)}%</text><text x="60" y="76" text-anchor="middle" class="dl">mastered</text></svg>`;
}

/* ---------- answer widgets (shared by practice and exam) ---------- */
function fieldsOf(q){if(q.type==='mc'||q.type==='multi')return q.type;if(q.ans.kind==='int')return 'int';if(q.ans.kind==='reading')return 'plain';return q.ans.fields||'one';}
function stOf(qi){return qi==='p'?P:A.items[+qi];}
function respOf(st,q){
  if(q.type==='mc')return st.sel;if(q.type==='multi')return st.msel;
  const f=fieldsOf(q);return [st.resp[0],(f==='one'&&!st.x10)?'':st.resp[1],st.resp[2]];
}
function answered(st,q){if(q.type==='mc')return st.sel>=0;if(q.type==='multi')return st.msel.length>0;return String(st.resp[0]||'').trim()!=='';}
function nf(qi,f,val,opts){
  opts=opts||{};
  const inp=`<input class="nin${opts.cls?' '+opts.cls:''}" data-q="${qi}" data-f="${f}" type="text" inputmode="${opts.im||'decimal'}" enterkeyhint="done" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="${opts.label||'Answer'}" placeholder="${opts.ph||''}" value="${esc(val||'')}"${opts.lock?' disabled':''}>`;
  if(opts.noPM||opts.lock)return `<span class="nf">${inp}</span>`;
  return `<span class="nf"><button type="button" class="pm" data-act="pm" data-q="${qi}" data-f="${f}" aria-label="Switch between positive and negative">±</button>${inp}</span>`;
}
function answerHTML(q,st,qi,lock,reveal){
  const f=fieldsOf(q);
  if(f==='mc'){
    const pics=q.choices.some(c=>/^<svg/.test(c));
    return `<div class="choices${pics?' pics':''}" role="radiogroup" aria-label="Answer choices">${q.choices.map((c,i)=>{
      let cls='choice';if(reveal){if(i===q.ans.correct)cls+=' right';else if(i===st.sel)cls+=' wrong';}
      return `<button type="button" class="${cls}" role="radio" aria-checked="${st.sel===i}" data-act="pick" data-q="${qi}" data-i="${i}"${lock?' disabled':''}><span class="dot"></span><span>${c}</span></button>`;}).join('')}</div>`;
  }
  if(f==='multi'){
    const C=new Set(q.ans.correct);
    return `<div class="choices checks" role="group" aria-label="Select all that apply">${q.choices.map((c,i)=>{
      const on=st.msel.includes(i);let cls='choice';if(reveal){if(C.has(i)&&on)cls+=' right';else if(on)cls+=' wrong';else if(C.has(i))cls+=' missed';}
      return `<button type="button" class="${cls}" role="checkbox" aria-checked="${on}" data-act="mpick" data-q="${qi}" data-i="${i}"${lock?' disabled':''}><span class="box"></span><span>${c}</span>${reveal&&C.has(i)&&!on?'<span class="tag">missed</span>':''}</button>`;}).join('')}</div>`;
  }
  const units=q.ans.units?`<span class="unit">${uH(q.ans.units)}</span>`:'';
  const r=st.resp;
  if(f==='sci'||f==='sciSF'){
    let h=`<div class="numrow sci">${nf(qi,0,r[0],{label:'Number from 1 to 10',ph:'',lock})}<span class="x10">× 10</span><sup class="expbox">${nf(qi,1,r[1],{label:'Power of ten',ph:'n',lock,cls:'exp'})}</sup>${units}</div>`;
    if(f==='sciSF')h+=`<label class="sfrow">Sig figs in your answer ${nf(qi,2,r[2],{label:'Number of significant figures',im:'numeric',noPM:true,lock,cls:'sm'})}</label>`;
    return `<div class="numwrap">${h}</div>`;
  }
  if(f==='one'){
    let h=`<div class="numrow">${nf(qi,0,r[0],{label:'Answer',ph:'Answer',lock})}${st.x10?`<span class="x10">× 10</span><sup class="expbox">${nf(qi,1,r[1],{label:'Power of ten',ph:'n',lock,cls:'exp'})}</sup>`:''}${units}</div>`;
    if(!lock)h+=`<button type="button" class="linkbtn" data-act="x10" data-q="${qi}">${st.x10?'Remove the × 10ⁿ box':'Need a power of ten? Add × 10ⁿ'}</button>`;
    return `<div class="numwrap">${h}</div>`;
  }
  if(f==='std')return `<div class="numwrap"><div class="numrow">${nf(qi,0,r[0],{label:'Answer in decimal form',ph:'Decimal number',lock})}${units}</div></div>`;
  return `<div class="numwrap"><div class="numrow">${nf(qi,0,r[0],{label:'Answer',ph:f==='int'?'Whole number':'Reading',im:f==='int'?'numeric':'decimal',noPM:true,lock})}${units}</div></div>`;
}
function ansDisplay(q){
  if(q.type==='mc'||q.type==='multi')return q.ans.display;
  if(q.ans.kind==='int'||q.ans.kind==='reading')return esc(q.ans.display)+(q.ans.units?' '+uH(q.ans.units):'');
  return nH(q.ans.display)+(q.ans.units?' '+uH(q.ans.units):'')+(q.ans.fields==='sciSF'?`, ${pl(q.ans.N,'sig fig')}`:'');
}
function yourAnswer(st,q){
  if(q.type==='mc')return st.sel>=0?q.choices[st.sel]:'No answer';
  if(q.type==='multi')return st.msel.length?st.msel.slice().sort((a,b)=>a-b).map(i=>q.choices[i]).join(', '):'No answer';
  const r=respOf(st,q);if(!String(r[0]||'').trim())return 'No answer';
  let s=esc(r[0]);if(String(r[1]||'').trim())s+=` × 10<sup>${esc(r[1])}</sup>`;if(fieldsOf(q)==='sciSF')s+=`, ${esc(r[2]||'?')} sig figs`;return s;
}
function expInner(q,why,tid){
  const how=HOW_BY_ID[tid]||'';const steps=q.explain.filter(Boolean);
  let h='';
  if(why)h+=`<div class="why"><p class="xl">What went wrong</p><p>${why}</p></div>`;
  if(how)h+=`<div class="how2"><p class="xl">Strategy</p><p>${how}</p></div>`;

  return h;

function refreshAnswer(qi){
  const box=document.getElementById('ans-'+qi);if(!box)return;const st=stOf(qi);const q=st.q;
  box.innerHTML=answerHTML(q,st,qi,false,false);

function streakChip(s){return `<span class="streak${s.s>0?' hot':''}" title="Correct answers in a row">Streak ${s.s}</span>`;}
function mixPick(id){
  const pool=active().filter(x=>!mixCh(id)||x.ch===mixCh(id));const weak=pool.filter(x=>!S.t[x.id].m);
  const src=weak.length&&Math.random()<0.8?weak:pool;let t=pick(src);
  if(src.length>1)for(let i=0;i<4&&t.id===P.qtid;i++)t=pick(src);return t;
}
function newQ(){const t=isMix(V.tid)?mixPick(V.tid):topic(V.tid);Object.assign(P,{qtid:t.id,why:'',won:false,q:safeGen(t),sel:-1,msel:[],resp:['','',''],x10:false,tries:0,missed:false,pen:false,done:false,exp:false,fb:null});}
function openTopic(id){V.view='topic';V.tid=id;newQ();render();window.scrollTo(0,0);}
function penalize(){if(P.pen)return;P.pen=true;knock(S.t[P.qtid]);}
function doCheck(){
  if(P.done)return;const q=P.q;
  const res=checkAnswer(q,respOf(P,q),S.set.strict);
  if(res.invalid){P.fb={kind:'warn',title:'',msg:res.msg};render();return;}
  const s=S.t[P.qtid],t=topic(P.qtid);
  if(res.ok){
    if(!P.missed){
      s.a++;s.c++;const was=s.m,p0=s.p;const won=gain(s);
      if(won&&!was){P.won=true;const nx=isMix(V.tid)?null:nextSection(t.id);

    }else P.fb={kind:'ok',title:'Correct on the second try.',msg:'Your streak resets, but you keep your progress.'+(res.note?' '+res.note:'')};

  }else{

function sheetHTML(){
  const eq=[['1 km','0.6214 mi'],['1 m','39.37 in'],['1 m','1.097 yd'],['1 ft','30.48 cm'],['1 in','2.54 cm','exact'],['1 acre','43,560 ft²'],['1 US gal','3.785 L'],['1 kg','2.205 lb'],['1 lb','453.59 g'],['1 oz','28.35 g'],['1 ton','2000 lb'],['1 hr','60 min'],['1 min','60 sec'],['1 mL','1 cm³'],['1 L','1000 mL'],['1 L','1000 cm³'],['1 L','1.057 qt'],['1 Cal','1000 cal'],['1 cal','4.184 J','exact']];
  const pf=[['giga','G',9],['mega','M',6],['kilo','k',3],['deci','d',-1],['centi','c',-2],['milli','m',-3],['micro','μ',-6],['nano','n',-9],['pico','p',-12]];
  let h=header('sheet');
  h+=`<div class="sheet"><section class="panel"><h2>Given on your exam</h2><p class="sub">These are on the formula sheet, so focus on knowing when to use them.</p>
<div class="fl">Density = ${frac('Mass','Volume')}</div>
<div class="fl">q = m × c × ΔT<small>Heat = mass × specific heat × temperature change. ΔT = T<sub>final</sub> − T<sub>initial</sub>.</small></div>
<div class="fl">T(°F) = T(°C) × ${frac('9','5')} + 32</div>
<div class="fl">T(K) = T(°C) + 273.15</div>
<div class="fl">Volume = length × width × height<small>or area × height</small></div>
<div class="fl">Cylinder: V = πr<sup>2</sup>h</div>
<div class="fl">Sphere: V = ${frac('4','3')}πr<sup>3</sup></div>
<div class="fl">Circle: A = πr<sup>2</sup></div>
<div class="fl">Percent yield = ${frac('Actual yield','Theoretical yield')} × 100<small>On the sheet, but not part of chapters 1 to 3.</small></div>
<h3>Unit equivalents</h3><div class="eqs">${eq.map(x=>`<span>${x[0]} = ${uH(x[1])}${x[2]?'<em>exact</em>':''}</span>`).join('')}</div>
<p class="sub" style="margin-top:12px">The periodic table is on the sheet too.</p></section>
<section class="panel"><h2>Not on the sheet</h2><p class="sub">Memorize these before the exam.</p>
<h3>Metric prefixes</h3><table class="pfx">${pf.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${pow10H(x[2])}</td></tr>`).join('')}</table>
<h3>Counting sig figs</h3><ul class="plist"><li>Nonzero digits always count.</li><li>Zeros between nonzero digits count (8.000<b>7</b> has 5).</li><li>Leading zeros never count (0.0<b>3020</b> has 4).</li><li>Trailing zeros count after a decimal point (7.1000 has 5, 100.20 has 5).</li><li>Trailing zeros with no decimal point are <b>ambiguous</b> (1200). A decimal point at the end makes them count (1200. has 4).</li><li>Counted and defined numbers are exact, so they have <b>infinite</b> sig figs.</li></ul>
<h3>Sig figs in calculations</h3><ul class="plist"><li>× and ÷: keep the fewest <b>sig figs</b>.</li><li>+ and −: keep the fewest <b>decimal places</b>.</li><li>Mixed: do each step by its own rule and round only at the very end.</li><li>Rounding: 5 or more rounds up, 4 or less stays.</li><li>Digital readouts: record exactly what is displayed.</li></ul>
<h3>Scientific notation</h3><ul class="plist"><li>Front number from 1 up to 10. Big numbers get positive exponents, numbers under 1 get negative ones.</li><li>Keep every sig fig: 300400. becomes 3.00400 × 10<sup>5</sup>, and 4.500 × 10<sup>2</sup> becomes 450.0.</li></ul>
<h3>Classifying matter</h3><ul class="plist"><li>Mixture: homogeneous (uniform, solutions, anything (aq)) or heterogeneous (visible parts).</li><li>Pure substance, element: atomic (metals, noble gases) or molecular (H<sub>2</sub> N<sub>2</sub> O<sub>2</sub> F<sub>2</sub> Cl<sub>2</sub> Br<sub>2</sub> I<sub>2</sub>, P<sub>4</sub>, S<sub>8</sub>).</li><li>Pure substance, compound: ionic (metal + nonmetal) or molecular (nonmetals only).</li><li>Separations: filtration (solid from liquid), distillation (by boiling point), magnetism (iron), decanting (pour off).</li></ul>
<h3>Handy rearrangements</h3><div class="fl">T(°C) = (T(°F) − 32) × ${frac('5','9')}</div><div class="fl">T(°C) = T(K) − 273.15</div><div class="fl">mass = density × volume, volume = ${frac('mass','density')}</div>
<h3>Other facts</h3><ul class="plist"><li>SI base units: kg, m, s, K. Water: 1.00 g/mL.</li><li>1 ft = 12 in, 1 day = 24 hr, 1 Cal = 1 kcal.</li><li>Physical change keeps the substance (melting, bending, dissolving). Chemical change makes a new one (burning, rusting, reacting). A burning candle is both.</li><li>Exothermic: gets hot, releases heat. Endothermic: gets cold, absorbs heat.</li><li>Observation: what you see or measure. Hypothesis: testable guess. Law: what always happens. Theory: explains why.</li></ul></section></div>`;

    case 'enav':V.exam.navOpen=!V.exam.navOpen;render();break;
    case 'ejump':{const el=document.getElementById('eq-'+b.getAttribute('data-i'));V.exam.navOpen=false;render();const el2=document.getElementById('eq-'+b.getAttribute('data-i'));if(el2)el2.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});break;}
    case 'eflag':{const i=+b.getAttribute('data-i');const it=A.items[i];it.flag=!it.flag;b.classList.toggle('on',it.flag);b.setAttribute('aria-pressed',String(it.flag));b.textContent=it.flag?'Flagged':'Flag';saveAttempt();const nb=document.querySelector(`#enav [data-i="${i}"]`);if(nb)nb.classList.toggle('f',it.flag);break;}
    case 'esubmit':{
      const n=A.items.length,done=A.items.filter(it=>answered(it,it.q)).length;
      if(!V.exam.submitArm){V.exam.submitArm=true;document.querySelectorAll('[data-act="esubmit"]').forEach(x=>{x.textContent='Confirm';});const w=document.getElementById('earm');if(w){w.hidden=false;w.textContent=(n-done?`${n-done} question${n-done===1?' is':'s are'} blank. `:'')+'Tap Confirm to finish, or keep working.';}}
      else submitExam(false);
      break;}
  }
});
app.addEventListener('input',e=>{
  const t=e.target;if(!t.classList||!t.classList.contains('nin'))return;
  const qi=t.getAttribute('data-q'),f=+t.getAttribute('data-f');const st=stOf(qi);if(!st)return;st.resp[f]=t.value;touched(qi);
});
app.addEventListener('change',e=>{
  const k=e.target.getAttribute&&e.target.getAttribute('data-set');
  if(k){S.set[k]=e.target.checked;applyTheme();save();render();return;}
  if(e.target.id==='tsel'){openTopic(e.target.value);return;}
  const ek=e.target.getAttribute&&e.target.getAttribute('data-eset');if(ek){V.exam[ek]=e.target.checked;if(ek==='focus'||ek==='ctimed')render();}
});
app.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('settings'))V.setOpen=e.target.open;},true);
app.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!e.target.classList||!e.target.classList.contains('nin'))return;e.preventDefault();
  const qi=e.target.getAttribute('data-q');
  if(qi==='p'){if(P.done){newQ();render();focusFirst('p');}else doCheck();}
  else{const ins=[...document.querySelectorAll(`#ans-${qi} input.nin`)];const k=ins.indexOf(e.target);if(k<ins.length-1)ins[k+1].focus();else e.target.blur();}
});
document.addEventListener('keydown',e=>{
  if(V.view!=='topic')return;const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||e.metaKey||e.ctrlKey||e.altKey)return;
  const q=P.q;if(!q)return;
  if((q.type==='mc'||q.type==='multi')&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('#ans-p .choice')[+e.key-1];if(b&&!b.disabled){b.click();e.preventDefault();}return;}
  if(e.key==='Enter'&&(e.target===document.body||e.target===document.documentElement)){e.preventDefault();if(P.done){newQ();render();}else doCheck();}
});

applyTheme();
if(A&&A.timed&&A.endAt<=Date.now()){V.view='exam';submitExam(true);}else render();
initSync();
})();

</script>
</body>
